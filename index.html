<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="芳澤的个人作品集与博客。探索机器视觉、交互设计与文字。"><title>芳澤 · 作品与手记</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
:root{--paper:#f5f3ec;--ink:#263d33;--muted:#777f73;--line:#d8dcd0;--accent:#d7e7b9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 Arial,'Microsoft Yahei',sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}header{max-width:1400px;margin:auto;padding:27px 5%;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:40px}.brand{font:600 29px 'Noto Serif SC',serif;display:flex;align-items:center;gap:18px}.brand span{font:9px/1.4 Arial;letter-spacing:2px;max-width:100px}nav{margin:auto;display:flex;gap:35px;font-size:13px}nav a.active{border-bottom:1px solid var(--ink)}.github{border:1px solid var(--line);border-radius:30px;padding:7px 18px;font-size:12px}main{max-width:1260px;margin:auto;padding:0 34px}.eyebrow{font:11px Arial;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:60px;padding:75px 0 65px;align-items:center}.hero h1{font:500 clamp(36px,4.2vw,60px)/1.5 'Noto Serif SC',serif;letter-spacing:2px;margin:22px 0}.hero h1 em{font-style:normal;color:#758664}.hero p{color:var(--muted);max-width:430px;line-height:2}.actions{display:flex;gap:20px;margin-top:30px;align-items:center}.primary{display:inline-block;background:var(--ink);color:var(--paper);padding:12px 23px;border-radius:3px;font-size:13px}.text-link{font-size:13px;border-bottom:1px solid var(--line);padding:9px 0}.art{height:375px;position:relative;overflow:hidden;background:#e8ecdf;border-radius:150px 150px 4px 4px;background-image:linear-gradient(transparent 98%,#aebda733 98%),linear-gradient(90deg,transparent 98%,#aebda733 98%);background-size:32px 32px}.sun{width:140px;height:140px;background:#e8cd83;border-radius:50%;position:absolute;top:50px;right:60px}.hill{position:absolute;width:500px;height:240px;border-radius:50%;transform:rotate(-24deg);background:#c2cdb0;bottom:-80px;left:-90px}.hill.second{background:#82957c;left:130px;bottom:-90px;transform:rotate(-42deg)}.arch{position:absolute;width:140px;height:220px;border:1px solid #405d44;bottom:50px;left:120px;border-radius:90px 90px 0 0;transform:rotate(12deg)}.arch:after{content:'</>';font:38px monospace;position:absolute;top:75px;left:35px;color:#405d44}.art-caption{position:absolute;bottom:17px;left:22px;font:9px monospace;letter-spacing:2px;color:#fff}.floating{position:absolute;top:180px;right:25px;background:#f5f3ecee;border:1px solid white;padding:12px 19px;font:11px monospace;transform:rotate(-7deg)}.intro-line{border-block:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:1px}.section{padding:58px 0}.section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.section-heading h2,.page-title{font:500 30px 'Noto Serif SC',serif;margin:9px 0}.section-heading .text-link{margin-bottom:6px}.projects{display:grid;grid-template-columns:1fr 1fr;gap:30px}.project{display:block}.cover{height:255px;overflow:hidden;padding:28px 40px;background:#dce3d5;position:relative;transition:transform .3s}.project:hover .cover{transform:translateY(-4px)}.mock{height:220px;background:#182c2a;color:#dcebdc;border:5px solid #f3f4ed;box-shadow:0 18px 35px #1a342330;border-radius:5px;padding:14px;font:9px monospace;transform:rotate(-3deg)}.mock-top{border-bottom:1px solid #446059;padding-bottom:12px;display:flex;justify-content:space-between}.screen{display:grid;grid-template-columns:1fr 2fr;gap:12px;padding-top:15px}.metric{font-size:32px;line-height:1.2;color:#b7d49d}.scan{height:120px;background:repeating-linear-gradient(93deg,#637374,#7c8b88 3px,#445b56 5px);position:relative}.scan:after{content:'SCRATCH · DETECTED';position:absolute;border:1px solid #cbd67c;color:#e9efb7;left:20%;top:30%;width:55%;height:40%;font-size:8px;padding:3px}.mini-bars{display:flex;gap:8px;height:65px;align-items:end}.mini-bars i{display:block;flex:1;background:#a0bf8d;height:var(--h)}.cover.blue{background:#dbe1e6}.blue .mock{transform:rotate(3deg);background:#202b40}.pipeline{display:flex;gap:8px;flex-direction:column}.pipeline span{border:1px solid #53627c;padding:6px}.vision{height:125px;background:radial-gradient(circle at center,#263c51 25%,#8faaa4 26%,#8faaa4 28%,#263c51 29%,#172235 40%);border:1px solid #506177;display:grid;place-items:center;color:#b6d7c6}.project-info{display:flex;justify-content:space-between;align-items:center}.project h3{font:500 20px 'Noto Serif SC',serif;margin:17px 0 6px}.project p{font-size:12px;color:var(--muted);margin:0}.tags{font:10px monospace;color:var(--muted);margin-top:12px}.more-project{border:1px solid var(--line);padding:25px;background:#eeefe7}.more-project h3{margin-top:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.filter{border:1px solid var(--line);background:transparent;padding:6px 18px;border-radius:20px;font-size:12px;color:var(--ink)}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}.journal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px}.entry{border-top:1px solid var(--ink);padding:20px 0;display:block}.entry small{color:var(--muted);font-size:10px}.entry h3{font:500 20px/1.7 'Noto Serif SC',serif;margin:15px 0}.entry p{font-size:13px;color:var(--muted)}.entry .arrow{font-size:23px;display:block;margin-top:18px}.about-box{background:#e6eadd;padding:44px 45px;display:flex;gap:45px;align-items:center}.monogram{font:60px 'Noto Serif SC',serif;border:1px solid #97aa8b;border-radius:50%;width:115px;height:115px;flex-shrink:0;display:grid;place-items:center}.about-box h2{font:500 27px 'Noto Serif SC',serif;margin:0 0 10px}.about-box p{color:#62705f;max-width:700px}.page-head{padding:65px 0 15px}.page-head p{color:var(--muted)}.search{border:0;border-bottom:1px solid var(--line);padding:12px 0;background:transparent;width:100%;max-width:400px;outline-offset:5px}.article{max-width:730px;margin:60px auto 90px}.article h1{font:500 36px/1.6 'Noto Serif SC',serif}.article h2{font:500 24px 'Noto Serif SC',serif;margin-top:36px}.article p{line-height:2.1;color:#52604e}.notice{padding:13px 18px;background:#e6eadd;color:#65745e;font-size:12px}.empty{padding:40px;color:var(--muted)}footer{max-width:1192px;margin:40px auto 0;border-top:1px solid var(--line);padding:26px 0;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}a:focus-visible,button:focus-visible{outline:2px solid #7a914b;outline-offset:5px}@media(max-width:760px){header{gap:15px;padding:22px}.brand span,.github{display:none}nav{gap:18px;margin-left:auto;margin-right:0;font-size:12px}main{padding:0 22px}.hero{grid-template-columns:1fr;gap:25px;padding:45px 0}.hero h1{font-size:37px}.art{height:290px}.intro-line span:last-child{display:none}.projects,.journal-grid{grid-template-columns:1fr}.cover{height:235px;padding:25px}.section{padding:38px 0}.section-heading h2{font-size:25px}.about-box{padding:26px;display:block}.monogram{width:70px;height:70px;font-size:36px;margin-bottom:20px}footer{margin:30px 22px 0;gap:20px;flex-wrap:wrap}footer span:nth-child(2){display:none}.article h1{font-size:29px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style></head><body><header><a class="brand" href="#home">芳澤<span>FANGZE / PERSONAL SPACE</span></a><nav aria-label="主导航"><a href="#home">首页</a><a href="#work">作品集</a><a href="#journal">博客 <span>↗</span></a><a href="#about">关于我</a></nav><a class="github" href="https://github.com/philo-max" target="_blank" rel="noopener">GitHub ↗</a></header><main id="app"></main><footer><a href="#home">芳澤 / philo-max</a><span>在代码与文字之间，留下自己的注脚。</span><span>© 2026</span></footer><script>const projects=[{name:'SteelEye · 钢铁之眼',repo:'steel-defect-detection',cat:'机器视觉',desc:'从缺陷识别到交互工作站，探索钢铁表面的视觉质检。',tags:'React / FastAPI / YOLOv8',type:'steel'},{name:'NaviVision Studio',repo:'NaviVision-Studio',cat:'机器视觉',desc:'轻量机器视觉 IDE，让算子、图像与处理流水线相遇。',tags:'Python / FastAPI / OpenCV',type:'blue'},{name:'智能制造 · 数据可视化',repo:'smart-mfg-dashboards',cat:'交互与可视化',desc:'串联仓库、物流、AGV、装配和检测的产线可视化实验。',tags:'Vue 3 / TypeScript / ECharts'},{name:'CV Craft & Convert',repo:'CV-Craft-Convert',cat:'实用工具',desc:'关注内容与版面的简历编辑器，支持排版调整和多种导出。',tags:'React / Electron / jsPDF'}];
const posts=[{id:'seeing',cat:'技术手记',title:'从一张图像，到一条视觉流水线',desc:'以 NaviVision Studio 为线索，梳理图像处理、算子编排与结果反馈之间的关系。',time:'4 分钟',sections:[['让每一步都看得见','机器视觉工作流可以从读取图像开始，经过滤波、分割和测量，再将结果交还给界面。NaviVision Studio 的项目说明将算子流水线作为核心，这为理解每一步处理提供了清晰的入口。'],['参数变化之后','上游参数变化，会影响后续步骤。项目采用级联指纹缓存来处理这种依赖：变化向下游传播，未变化的步骤则可以复用已有结果。'],['继续探索','这篇示例整理自公开 README，适合作为博客结构的起点。后续可以补充实际样本、处理前后的图像，以及你在实现过程中遇到的问题。']]},{id:'dashboard',cat:'设计随想',title:'让数据大屏，讲清一条产线的故事',desc:'从模块之间的关联出发，思考可视化如何帮助理解业务。',time:'3 分钟',sections:[['从物料的旅程开始','智能制造大屏项目按仓库、物流、AGV、装配和检测组织内容。顺着物料流向浏览，能把分散的指标放回具体的业务过程。'],['把关联变成可探索的路径','模块下钻、工件追溯与异常联动，为查看数据提供不同的入口。比起孤立的数字，指标之间的因果关系更值得在界面中被解释。'],['关于这篇文章','这是依据项目公开说明编写的示例文章，尚未加入作者的个人复盘。可以继续补充设计草图、交互取舍与实际截图。']]},{id:'between',cat:'生活与文字',title:'为代码之外的文字，留一处空白',desc:'这里将收藏诗、片段和日常观察，慢慢长成自己的文字花园。',time:'2 分钟',sections:[['一页新的手记','博客除了记录项目，也可以容纳尚未成篇的想法。一段路上的观察、一句反复修改的诗，都可以成为这里的开始。'],['等待你的文字','这是一篇用于展示阅读版式的示例，还不是你的原创文章。你可以把喜欢的诗作、散文或日记放在这里，为它选择一个标题和分类。']]}];
const $=s=>document.querySelector(s);let filter='全部',query='';
function cover(p){return `<div class="cover ${p.type==='blue'?'blue':''}"><div class="mock"><div class="mock-top"><span>${p.type==='blue'?'NAVIVISION / WORKSPACE':'STEELEYE / VISION WORKSTATION'}</span><span>● SYSTEM READY</span></div><div class="screen">${p.type==='blue'?'<div class="pipeline"><span>01 Read image</span><span>02 Threshold</span><span>03 Measure</span></div><div class="vision">◎ &nbsp; IMAGE VIEWPORT</div>':'<div><span>VISION INSPECTION</span><div class="metric">AI<span style="font-size:12px"> / ON</span></div><div class="mini-bars"><i style="--h:30%"></i><i style="--h:70%"></i><i style="--h:50%"></i><i style="--h:90%"></i><i style="--h:65%"></i></div></div><div class="scan"></div>'}</div></div><span class="art-caption">INTERFACE STUDY / 示意视觉</span></div>`}
function project(p,i){return `<a class="project ${i>1?'more-project':''}" href="https://github.com/philo-max/${p.repo}" target="_blank" rel="noopener">${i<2?cover(p):''}<div class="project-info"><h3>${p.name}</h3><span>↗</span></div><p>${p.desc}</p><div class="tags">${p.tags}</div></a>`}
function entry(p){return `<a class="entry" href="#post/${p.id}"><small>${p.cat} &nbsp; / &nbsp; 示例文章 · ${p.time}</small><h3>${p.title}</h3><p>${p.desc}</p><span class="arrow">↗</span></a>`}
function heading(en,cn,link,text){return `<div class="section-heading"><div><span class="eyebrow">${en}</span><h2>${cn}</h2></div>${link?`<a class="text-link" href="${link}">${text} ↗</a>`:''}</div>`}
const about=`<div class="about-box"><div class="monogram">澤</div><div><span class="eyebrow">A LITTLE ABOUT ME</span><h2>你好，我是芳澤。</h2><p>在 GitHub，我是 philo-max。我的项目围绕机器视觉、数据可视化与实用工具展开。这里收藏正在打磨的作品，也为代码之外的文字留一处空间。</p><a class="text-link" href="https://github.com/philo-max" target="_blank" rel="noopener">在 GitHub 找到我 ↗</a></div></div>`;
function home(){return `<section class="hero"><div><span class="eyebrow">PHILO-MAX · BUILDING & WRITING</span><h1>把想法写成代码，<br>把日常<em>留给文字。</em></h1><p>你好，我是芳澤。<br>探索机器视觉与交互，也收集生活里值得留下的片刻。欢迎来到我的数字花园。</p><div class="actions"><a class="primary" href="#work">探索我的作品 &nbsp; ↗</a><a class="text-link" href="#journal">读一篇手记 →</a></div></div><div class="art" aria-label="山丘、太阳与代码拱门的抽象插画"><div class="sun"></div><div class="hill"></div><div class="hill second"></div><div class="arch"></div><div class="floating">ideas → code → little things</div><span class="art-caption">A GARDEN OF THOUGHTS, ALWAYS GROWING.</span></div></section><div class="intro-line"><span>机器视觉 / 交互探索 / 文字创作</span><span>不断尝试，慢慢生长。</span><span>PERSONAL COLLECTION — 2026</span></div><section class="section">${heading('SELECTED WORK','一些想法，正在成为作品','#work','全部作品')}<div class="projects">${projects.slice(0,2).map(project).join('')}</div></section><section class="section">${heading('THE JOURNAL','项目之外，字里行间','#journal','进入博客')}<div class="journal-grid">${posts.map(entry).join('')}</div></section><section class="section">${about}</section>`}
function work(){return `<section class="page-head"><span class="eyebrow">THE PORTFOLIO</span><h1 class="page-title">作品集</h1><p>从工业视觉到日常工具，把想法放进可交互的界面。</p></section><div class="filters">${['全部','机器视觉','交互与可视化','实用工具'].map(c=>`<button class="filter ${c===filter?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><div class="projects section">${projects.map((p,i)=>filter==='全部'||p.cat===filter?project(p,i):'').join('')}</div>`}
function journal(){return `<section class="page-head"><span class="eyebrow">NOTES & FRAGMENTS</span><h1 class="page-title">字里行间</h1><p>关于创造的过程，也关于生活中细小的发现。</p><input class="search" aria-label="搜索文章" placeholder="搜索手记、主题或关键词…" value="${query.replaceAll('&','&amp;').replaceAll('"','&quot;')}"></section><div class="filters">${['全部','技术手记','设计随想','生活与文字'].map(c=>`<button class="filter ${c===filter?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><div id="entries" class="journal-grid section"></div>`}
function updateEntries(){const list=posts.filter(p=>(filter==='全部'||filter===p.cat)&&`${p.title}${p.desc}`.includes(query));$('#entries').innerHTML=list.length?list.map(entry).join(''):'<p class="empty">暂时没有匹配的文章，试试其他关键词。</p>'}
function render(){let route=location.hash.slice(1)||'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+route));if(route.startsWith('post/')){const p=posts.find(p=>p.id===route.split('/')[1]);$('#app').innerHTML=p?`<article class="article"><a class="text-link" href="#journal">← 返回博客</a><h1>${p.title}</h1><p class="eyebrow">${p.cat} · ${p.time}</p><div class="notice">示例文章：用于展示博客阅读体验，可替换为你的原创内容。</div>${p.sections.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join('')}<a class="text-link" href="#journal">浏览更多手记 ↗</a></article>`:'<p class="empty">文章不存在。<a href="#journal">返回博客</a></p>'}else $('#app').innerHTML=route==='work'?work():route==='journal'?journal():route==='about'?`<section class="page-head"><span class="eyebrow">BEHIND THE WORK</span><h1 class="page-title">关于我</h1></section><section class="section">${about}</section>`:home();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if(route==='journal'){updateEntries();$('.search').addEventListener('input',e=>{query=e.target.value;updateEntries()})}document.title=({home:'芳澤 · 作品与手记',work:'作品集 · 芳澤',journal:'博客 · 芳澤',about:'关于我 · 芳澤'})[route]||'阅读手记 · 芳澤'}window.addEventListener('hashchange',()=>{filter='全部';query='';render();window.scrollTo(0,0)});render();
</script></body></html>
